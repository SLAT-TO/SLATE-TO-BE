name: CD Prod

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/slat-to/slat-to-be:${{ github.sha }}
            ghcr.io/slat-to/slat-to-be:latest

      - name: Copy Docker Compose File to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USERNAME }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /home/ubuntu/deploy
          overwrite: true

      - name: Deploy Docker Container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USERNAME }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -e

            DEPLOY_DIR="/home/ubuntu/deploy"
            COMPOSE_FILE="$DEPLOY_DIR/docker-compose.prod.yml"
            IMAGE_TAG="${{ github.sha }}"
            PREVIOUS_IMAGE=""

            cd "$DEPLOY_DIR"

            if docker inspect slatto-prod >/dev/null 2>&1; then
              PREVIOUS_IMAGE=$(docker inspect \
                --format='{{.Config.Image}}' \
                slatto-prod)
            fi

            echo "배포 이미지: ghcr.io/slat-to/slat-to-be:$IMAGE_TAG"

            IMAGE_TAG="$IMAGE_TAG" \
              docker compose -f "$COMPOSE_FILE" pull

            IMAGE_TAG="$IMAGE_TAG" \
              docker compose -f "$COMPOSE_FILE" up -d \
              --remove-orphans

            echo "Health Check 대기 중..."

            for i in $(seq 1 40); do
              if curl --silent \
                --fail \
                --max-time 3 \
                http://localhost:8081/api/v1/health \
                >/dev/null; then

                echo "Health Check 성공"
                docker image prune -f
                exit 0
              fi

              echo "서버 시작 대기 중... ($i/40)"
              sleep 3
            done

            echo "Health Check 실패"

            docker logs --tail 100 slatto-prod || true

            if [ -n "$PREVIOUS_IMAGE" ]; then
              echo "이전 이미지로 롤백합니다: $PREVIOUS_IMAGE"

              PREVIOUS_TAG="${PREVIOUS_IMAGE##*:}"

              IMAGE_TAG="$PREVIOUS_TAG" \
                docker compose -f "$COMPOSE_FILE" up -d \
                --remove-orphans

              echo "이전 이미지로 복구했습니다."
            else
              echo "이전 이미지 정보가 없어 자동 롤백할 수 없습니다."
            fi

            exit 1