name: CD Prod

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/slat-to/slat-to-be:${{ github.sha }}
            ghcr.io/slat-to/slat-to-be:latest

      - name: Copy Docker Compose File to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USERNAME }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /home/ubuntu/deploy
          overwrite: true

      - name: Copy Nginx Config to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USERNAME }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          source: infra/nginx/conf.d/upload-limits.conf
          target: /home/ubuntu/deploy
          overwrite: true

      # nginx 설정이 서버에만 있으면 인스턴스를 새로 띄울 때 기본값으로 돌아간다.
      # 리포의 파일을 매 배포마다 반영해서 서버 상태가 코드와 갈라지지 않게 한다.
      - name: Apply Nginx Config
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USERNAME }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -eu

            SOURCE="/home/ubuntu/deploy/infra/nginx/conf.d/upload-limits.conf"
            TARGET="/etc/nginx/conf.d/upload-limits.conf"

            if sudo cmp -s "$SOURCE" "$TARGET"; then
              echo "nginx 설정 변경 없음. reload 를 건너뜁니다."
              exit 0
            fi

            sudo cp "$SOURCE" "$TARGET"

            # 문법 검사를 통과할 때만 reload 한다. 실패하면 실행 중인 nginx 는 그대로 둔다.
            if ! sudo nginx -t; then
              echo "nginx 설정 검사 실패. 이전 설정으로 되돌립니다."
              sudo rm -f "$TARGET"
              exit 1
            fi

            sudo systemctl reload nginx
            echo "nginx 설정 반영 완료"

      - name: Deploy Docker Container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.PROD_EC2_USERNAME }}
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -u

            DEPLOY_DIR="/home/ubuntu/deploy"
            COMPOSE_FILE="$DEPLOY_DIR/docker-compose.prod.yml"
            NEW_IMAGE_TAG="${{ github.sha }}"
            PREVIOUS_IMAGE=""
            PREVIOUS_TAG=""

            cd "$DEPLOY_DIR"

            if docker inspect slatto-prod >/dev/null 2>&1; then
              PREVIOUS_IMAGE=$(docker inspect \
                --format='{{.Config.Image}}' \
                slatto-prod)

              PREVIOUS_TAG="${PREVIOUS_IMAGE##*:}"

              echo "현재 이미지: $PREVIOUS_IMAGE"
            else
              echo "현재 실행 중인 slatto-prod 컨테이너가 없습니다."
            fi

            rollback() {
              echo "배포 실패: 롤백을 시작합니다."

              docker logs --tail 100 slatto-prod 2>/dev/null || true

              if [ -z "$PREVIOUS_TAG" ]; then
                echo "이전 이미지 정보가 없어 자동 롤백할 수 없습니다."
                return 1
              fi

              echo "이전 이미지로 복구합니다: $PREVIOUS_IMAGE"

              if ! IMAGE_TAG="$PREVIOUS_TAG" \
                docker compose -f "$COMPOSE_FILE" up -d \
                --remove-orphans; then

                echo "롤백 컨테이너 실행에도 실패했습니다."
                return 1
              fi

              echo "롤백 Health Check 대기 중..."

              for i in $(seq 1 40); do
                if curl --silent \
                  --fail \
                  --max-time 3 \
                  http://localhost:8081/api/v1/health \
                  >/dev/null; then

                  echo "롤백 성공"
                  return 0
                fi

                echo "롤백 서버 시작 대기 중... ($i/40)"
                sleep 3
              done

              echo "롤백 후 Health Check에도 실패했습니다."
              return 1
            }

            echo "배포 이미지: ghcr.io/slat-to/slat-to-be:$NEW_IMAGE_TAG"

            if ! IMAGE_TAG="$NEW_IMAGE_TAG" \
              docker compose -f "$COMPOSE_FILE" pull; then

              echo "Docker 이미지 pull에 실패했습니다."
              exit 1
            fi

            if ! IMAGE_TAG="$NEW_IMAGE_TAG" \
              docker compose -f "$COMPOSE_FILE" up -d \
              --remove-orphans; then

              echo "Docker Compose 실행에 실패했습니다."
              rollback || true
              exit 1
            fi

            echo "Health Check 대기 중..."

            DEPLOY_SUCCESS=false

            for i in $(seq 1 40); do
              if curl --silent \
                --fail \
                --max-time 3 \
                http://localhost:8081/api/v1/health \
                >/dev/null; then

                DEPLOY_SUCCESS=true
                break
              fi

              echo "서버 시작 대기 중... ($i/40)"
              sleep 3
            done

            if [ "$DEPLOY_SUCCESS" != "true" ]; then
              echo "Health Check에 실패했습니다."
              rollback || true
              exit 1
            fi

            echo "Health Check 성공"
            echo "사용하지 않는 이전 Docker 이미지를 정리합니다."

            docker image prune -a -f

            echo "배포 완료"