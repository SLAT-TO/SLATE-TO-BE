spring:
  application:
    name: slatto

  servlet:
    multipart:
      # 서비스 코드의 개별 파일 한도(100MB)와 맞춘다. 여기가 더 작으면 요청이 컨트롤러에 닿기 전에
      # 잘려 MaxUploadSizeExceededException 이 나가고 서비스의 검증 로직이 실행되지 않는다.
      # request 는 파일 본문에 JSON 파트와 멀티파트 경계가 더해지므로 여유를 둔다.
      max-file-size: 100MB
      max-request-size: 105MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # 타임아웃이 없으면 SMTP 가 늦어질 때 발송 스레드가 무한정 잡힌다.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  flyway:
    # 기존 운영/개발 DB는 수동 반영된 V8 스키마를 기준점으로 등록한 뒤 이후 변경만 적용한다.
    baseline-on-migrate: true
    baseline-version: 8
    baseline-description: legacy-schema
    validate-on-migrate: true

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

cloud:
  aws:
    s3:
      bucket: ${CLOUD_AWS_S3_BUCKET}
      public-base-url: ${CLOUD_AWS_S3_PUBLIC_BASE_URL:}

youtube:
  api:
    key: ${YOUTUBE_API_KEY}
    connect-timeout: ${YOUTUBE_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${YOUTUBE_API_READ_TIMEOUT:5s}

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: slatto
    access-token-validity: PT1H
    refresh-token-validity: P14D

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
      scope: openid email profile

  frontend:
    base-url: ${FRONTEND_BASE_URL}
    callback-path: /auth/callback
    error-path: /auth/error
    allowed-redirect-paths:
      - /
      - /auth/callback
      - /onboarding

  invitation:
    base-url: ${PROJECT_INVITATION_BASE_URL:${FRONTEND_BASE_URL}/project-invitations}

  cookie:
    refresh-token-name: refreshToken
    oauth-state-name: oauthState
    path: /api/v1/auth
    # 로컬 http 환경에서만 false로 내린다. 배포 환경은 반드시 true 유지.
    secure: ${COOKIE_SECURE:true}
    # 프론트/API가 서로 다른 사이트면 None (COOKIE_SECURE=true 필수), 같은 사이트면 Lax
    same-site: ${COOKIE_SAME_SITE:Lax}
    oauth-state-same-site: Lax
    oauth-state-max-age: PT5M

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  mail:
    from-address: ${MAIL_USERNAME}
    from-name: ${MAIL_FROM_NAME:슬레이투}

  email-verification:
    code-validity: PT5M
    resend-cooldown: PT1M
    # 인증 확인 후 회원가입·비밀번호 재설정을 마쳐야 하는 시간
    verified-validity: PT30M
    max-send-per-hour: 5
    max-attempts: 5
